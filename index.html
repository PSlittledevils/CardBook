<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PERTHSANTA CARD COLLECTION 👿</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Cinzel", serif;
    color: #f5e9ec;
    background:
        radial-gradient(circle at top, #26070e 0%, #100609 35%, #050405 75%);
}

/* ========================================
   HEADER
======================================== */

header {
    text-align: center;
    padding: 45px 20px 35px;
    border-bottom: 1px solid rgba(255, 0, 45, 0.25);
    background:
        linear-gradient(
            180deg,
            rgba(50, 0, 12, 0.95),
            rgba(10, 5, 7, 0.85)
        );
}

.devil {
    font-size: 42px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px rgba(255, 0, 40, 0.55));
}

header h1 {
    margin: 0;
    font-size: clamp(25px, 4vw, 46px);
    letter-spacing: 4px;
    font-weight: 800;
    color: #f7dfe4;
    text-shadow:
        0 0 8px rgba(255, 0, 40, 0.35),
        0 0 30px rgba(180, 0, 30, 0.18);
}

.subtitle {
    margin: 14px 0 0;
    color: #a9959a;
    font-size: 13px;
    letter-spacing: 1.5px;
}

/* ========================================
   MAIN
======================================== */

main {
    width: min(1500px, calc(100% - 32px));
    margin: 0 auto;
    padding: 30px 0 70px;
}

/* ========================================
   HOME
======================================== */

.home-page {
    display: block;
}

.home-intro {
    text-align: center;
    margin-bottom: 28px;
}

.home-intro h2 {
    margin: 0;
    font-size: 25px;
    letter-spacing: 3px;
    color: #f2d8dd;
}

.home-intro p {
    margin: 9px 0 0;
    color: #79676c;
    font-size: 11px;
    letter-spacing: 2px;
}

.location-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
}

.location-card {
    position: relative;
    min-height: 210px;
    padding: 30px 25px;
    border: 1px solid rgba(150, 0, 30, 0.5);
    border-radius: 14px;
    background:
        linear-gradient(
            145deg,
            rgba(38, 10, 16, 0.95),
            rgba(9, 6, 8, 0.98)
        );
    cursor: pointer;
    overflow: hidden;
    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.location-card::before {
    content: "👿";
    position: absolute;
    right: -12px;
    bottom: -22px;
    font-size: 115px;
    opacity: 0.06;
    transform: rotate(-12deg);
}

.location-card:hover {
    transform: translateY(-6px);
    border-color: rgba(255, 0, 45, 0.8);
    box-shadow:
        0 0 15px rgba(255, 0, 45, 0.2),
        0 0 35px rgba(150, 0, 25, 0.15);
}

.location-card h3 {
    margin: 0 0 12px;
    color: #f5dce1;
    font-size: 24px;
    letter-spacing: 3px;
}

.location-card .location-count {
    color: #756369;
    font-size: 11px;
    letter-spacing: 1px;
}

.location-progress {
    margin-top: 25px;
}

.location-progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
    color: #88757b;
    font-size: 9px;
}

.location-progress-bar {
    height: 5px;
    border-radius: 99px;
    overflow: hidden;
    background: #21151a;
}

.location-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8d001e, #ff1648);
    box-shadow: 0 0 8px rgba(255, 0, 45, 0.45);
    transition: width 0.3s ease;
}

/* ========================================
   LOCATION PAGE
======================================== */

.location-page {
    display: none;
}

.location-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 25px;
}

.back-button {
    border: 1px solid rgba(170, 0, 35, 0.55);
    background: rgba(35, 8, 14, 0.9);
    color: #dcb9c0;
    border-radius: 8px;
    padding: 10px 17px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.2s ease;
}

.back-button:hover {
    background: rgba(100, 0, 20, 0.7);
    border-color: #ff1648;
    color: #fff;
}

.location-title {
    text-align: right;
}

.location-title h2 {
    margin: 0;
    color: #f5dce1;
    letter-spacing: 3px;
    font-size: 27px;
}

.location-title p {
    margin: 5px 0 0;
    color: #735f65;
    font-size: 10px;
    letter-spacing: 1px;
}

/* ========================================
   SUMMARY DASHBOARD
======================================== */

.summary-dashboard {
    margin-bottom: 38px;
    padding: 25px;
    border: 1px solid rgba(145, 0, 30, 0.45);
    border-radius: 12px;
    background:
        linear-gradient(
            145deg,
            rgba(27, 9, 14, 0.97),
            rgba(8, 6, 8, 0.98)
        );
    box-shadow:
        inset 0 0 25px rgba(100, 0, 20, 0.08),
        0 10px 30px rgba(0, 0, 0, 0.3);
}

.summary-heading {
    text-align: center;
    margin-bottom: 22px;
}

.summary-heading h3 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 3px;
    color: #e9cfd5;
}

.summary-heading p {
    margin: 6px 0 0;
    color: #6e5a60;
    font-size: 9px;
    letter-spacing: 2px;
}

.summary-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.summary-stat {
    text-align: center;
    padding: 14px 8px;
    border: 1px solid rgba(100, 70, 75, 0.2);
    background: rgba(20, 10, 13, 0.75);
    border-radius: 8px;
}

.stat-number {
    display: block;
    font-size: 25px;
    font-weight: 700;
    color: #e3cbd0;
}

.stat-label {
    display: block;
    margin-top: 5px;
    color: #67545a;
    font-size: 8px;
    letter-spacing: 1.5px;
}

.summary-stat.collected .stat-number {
    color: #ff3158;
    text-shadow: 0 0 10px rgba(255, 0, 45, 0.35);
}

.summary-stat.missing .stat-number {
    color: #857177;
}

/* ========================================
   TOTAL PROGRESS
======================================== */

.total-progress {
    margin-top: 24px;
}

.total-progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #9d858b;
    font-size: 9px;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
}

.total-percentage {
    color: #ff3158;
    font-weight: 700;
}

.big-progress-bar {
    width: 100%;
    height: 8px;
    border-radius: 99px;
    overflow: hidden;
    background: #201318;
}

.big-progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #700016, #ff1749);
    box-shadow:
        0 0 10px rgba(255, 0, 45, 0.45);
    transition: width 0.35s ease;
}

/* ========================================
   SERIES BREAKDOWN
======================================== */

.series-summary-title {
    margin-top: 24px;
    margin-bottom: 10px;
    color: #806d72;
    font-size: 9px;
    letter-spacing: 2px;
}

.series-summary-list {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.series-summary-item {
    padding: 6px 9px;
    border: 1px solid rgba(110, 0, 25, 0.35);
    border-radius: 5px;
    background: rgba(20, 7, 11, 0.8);
    color: #766168;
    font-size: 8px;
    letter-spacing: 0.4px;
}

.series-summary-item.completed {
    color: #ff496a;
    border-color: rgba(255, 0, 45, 0.45);
}

/* ========================================
   SEARCH
======================================== */

.tools {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

.search-box {
    flex: 1;
    border: 1px solid rgba(120, 0, 25, 0.45);
    background: rgba(15, 7, 10, 0.9);
    color: #eee0e4;
    border-radius: 7px;
    padding: 11px 13px;
    outline: none;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
}

.search-box::placeholder {
    color: #57474c;
}

.search-box:focus {
    border-color: rgba(255, 0, 45, 0.65);
    box-shadow: 0 0 12px rgba(255, 0, 45, 0.08);
}

.reset-button {
    border: 1px solid rgba(150, 0, 30, 0.45);
    background: #18080d;
    color: #9d7e85;
    border-radius: 7px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 1px;
    cursor: pointer;
}

.reset-button:hover {
    border-color: #ff1648;
    color: #ff5472;
}

/* ========================================
   ★ CARD BOOK DIVIDER ★
======================================== */

.series-section {
    margin-bottom: 48px;
}

/*
   卡册分隔页
*/

.series-divider {
    position: relative;
    min-height: 118px;
    margin: 0 0 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    border-top: 1px solid rgba(255, 0, 45, 0.25);
    border-bottom: 1px solid rgba(255, 0, 45, 0.25);

    background:
        linear-gradient(
            90deg,
            rgba(70, 0, 16, 0.12),
            rgba(30, 7, 13, 0.85) 20%,
            rgba(18, 6, 10, 0.98) 50%,
            rgba(30, 7, 13, 0.85) 80%,
            rgba(70, 0, 16, 0.12)
        );

    box-shadow:
        inset 0 0 35px rgba(120, 0, 25, 0.1),
        0 10px 20px rgba(0, 0, 0, 0.25);
}

/* 上下小装饰 */

.series-divider::before {
    content: "◆";
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 0, 45, 0.45);
    font-size: 8px;
}

/* 左右装饰线 */

.series-divider::after {
    content: "";
    position: absolute;
    left: 4%;
    right: 4%;
    top: 50%;
    height: 1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(170, 0, 30, 0.35) 20%,
            rgba(170, 0, 30, 0.35) 80%,
            transparent
        );
    z-index: 0;
}

/* 分隔页里面的内容 */

.series-divider-inner {
    position: relative;
    z-index: 2;

    min-width: min(560px, 70%);
    padding: 18px 45px;

    text-align: center;

    border: 1px solid rgba(145, 0, 30, 0.5);
    border-radius: 7px;

    background:
        linear-gradient(
            145deg,
            #210910,
            #0c0709
        );

    box-shadow:
        0 0 18px rgba(120, 0, 25, 0.12),
        inset 0 0 18px rgba(255, 0, 45, 0.035);
}

/* 小编号 */

.series-index {
    color: #8f182d;
    font-size: 9px;
    letter-spacing: 4px;
    margin-bottom: 5px;
}

/* 系列名字 */

.series-divider-title {
    margin: 0;
    color: #efd9de;
    font-size: clamp(15px, 2vw, 22px);
    letter-spacing: 3px;
    line-height: 1.25;
    text-shadow:
        0 0 10px rgba(255, 0, 45, 0.18);
}

/* 收藏数量 */

.series-divider-count {
    margin-top: 8px;
    color: #765e65;
    font-size: 8px;
    letter-spacing: 2px;
}

/* 已完成系列 */

.series-section.completed .series-divider-inner {
    border-color: rgba(255, 0, 45, 0.75);
    box-shadow:
        0 0 15px rgba(255, 0, 45, 0.12),
        0 0 35px rgba(150, 0, 30, 0.08);
}

.series-section.completed .series-index {
    color: #ff3158;
}

.series-section.completed .series-divider-count {
    color: #ff496a;
}

/* ========================================
   CARDS GRID
======================================== */

.cards-grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    gap: 12px;
}

/* ========================================
   CARD
======================================== */

.card {
    position: relative;
    width: 100%;

    background:
        linear-gradient(
            145deg,
            #151012,
            #080708
        );

    border: 1px solid rgba(120, 0, 25, 0.4);
    border-radius: 7px;

    overflow: hidden;
    cursor: pointer;
    user-select: none;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
}

.card:hover {
    transform: translateY(-4px) scale(1.02);
    z-index: 5;
}

/* ========================================
   CARD IMAGE
======================================== */

.card-image {
    width: 100%;
    aspect-ratio: 2.5 / 3.5;

    background:
        radial-gradient(
            circle at center,
            #251116,
            #080708 75%
        );

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;

    transition:
        transform 0.25s ease,
        filter 0.25s ease;
}

.card:hover .card-image img {
    transform: scale(1.03);
}

.no-image {
    color: #4b393d;
    font-size: 8px;
    letter-spacing: 1px;
    text-align: center;
}

/* ========================================
   CARD INFO
======================================== */

.card-info {
    padding: 7px 6px 8px;

    background:
        linear-gradient(
            180deg,
            #120c0e,
            #080708
        );

    text-align: center;
}

.card-number {
    color: #9e898e;
    font-size: 10px;
    letter-spacing: 1.5px;
    font-weight: 700;
    line-height: 1;
}

.card-status {
    margin-top: 5px;

    font-size: 7px;
    line-height: 1.2;

    color: #55464a;

    letter-spacing: 0;
    white-space: nowrap;
}

/* ========================================
   NOT OWNED
======================================== */

.card.not-owned {
    filter: grayscale(100%) brightness(0.32);
    opacity: 0.7;
    border-color: rgba(80, 0, 20, 0.3);
}

.card.not-owned:hover {
    filter: grayscale(90%) brightness(0.42);
    opacity: 0.85;
}

/* ========================================
   OWNED
======================================== */

.card.owned {
    filter: grayscale(0%) brightness(1);
    opacity: 1;

    border-color: rgba(230, 0, 45, 0.9);

    box-shadow:
        0 0 7px rgba(240, 0, 45, 0.4),
        0 0 18px rgba(180, 0, 30, 0.22);
}

.card.owned:hover {
    box-shadow:
        0 0 10px rgba(255, 0, 50, 0.55),
        0 0 25px rgba(190, 0, 35, 0.3);
}

.card.owned .card-image img {
    filter: none;
}

.card.owned .card-number {
    color: #f3dce0;
}

.card.owned .card-status {
    color: #ff4163;

    text-shadow:
        0 0 6px rgba(255, 0, 40, 0.45);
}

/* ========================================
   OWNED HEART
======================================== */

.owned-mark {
    position: absolute;

    top: 4px;
    right: 4px;

    width: 19px;
    height: 19px;

    border-radius: 50%;

    background: rgba(80, 0, 15, 0.9);

    border: 1px solid rgba(255, 0, 45, 0.75);

    display: none;

    align-items: center;
    justify-content: center;

    font-size: 9px;

    box-shadow:
        0 0 8px rgba(255, 0, 40, 0.45);

    z-index: 3;
}

.card.owned .owned-mark {
    display: flex;
}

/* ========================================
   BINDER HOLE EFFECT
======================================== */

.card::after {
    content: "";

    position: absolute;

    left: 5px;
    top: 50%;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: rgba(255,255,255,0.15);

    box-shadow:
        0 -20px 0 rgba(255,255,255,0.06),
        0 20px 0 rgba(255,255,255,0.06);

    opacity: 0.35;

    pointer-events: none;
}

/* ========================================
   SEARCH RESULT
======================================== */

.search-highlight {
    border-color: #ff1648 !important;

    box-shadow:
        0 0 0 2px rgba(255, 0, 45, 0.2),
        0 0 20px rgba(255, 0, 45, 0.35) !important;

    transform: scale(1.03);
    z-index: 10;
}

/* ========================================
   EMPTY SEARCH
======================================== */

.no-results {
    display: none;

    text-align: center;

    padding: 50px 20px;

    color: #68565c;

    font-size: 11px;

    letter-spacing: 2px;
}

/* ========================================
   TABLET
======================================== */

@media (max-width: 1100px) {

    .cards-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
    }

    .location-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

}

/* ========================================
   MOBILE
======================================== */

@media (max-width: 700px) {

    main {
        width: min(100% - 18px, 1500px);
        padding-top: 20px;
    }

    header {
        padding: 30px 15px 25px;
    }

    header h1 {
        letter-spacing: 2px;
    }

    .subtitle {
        font-size: 10px;
        line-height: 1.6;
    }

    .location-grid {
        grid-template-columns: 1fr;
    }

    .location-card {
        min-height: 170px;
    }

    .location-top {
        align-items: flex-start;
    }

    .location-title h2 {
        font-size: 19px;
    }

    .location-title p {
        font-size: 8px;
    }

    .summary-dashboard {
        padding: 17px;
    }

    .summary-stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .tools {
        flex-direction: column;
    }

    .reset-button {
        min-height: 38px;
    }

    /*
       手机 4 张一排
    */

    .cards-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
    }

    .card-info {
        padding: 6px 4px 7px;
    }

    .card-number {
        font-size: 9px;
    }

    .card-status {
        font-size: 6px;
    }

    .owned-mark {
        width: 17px;
        height: 17px;
        font-size: 8px;
        top: 3px;
        right: 3px;
    }

    /*
       手机版分隔页
    */

    .series-divider {
        min-height: 105px;
        margin-bottom: 18px;
    }

    .series-divider-inner {
        min-width: 82%;
        padding: 15px 20px;
    }

    .series-divider-title {
        font-size: 13px;
        letter-spacing: 1.5px;
    }

    .series-divider-count {
        font-size: 7px;
        letter-spacing: 1px;
    }

}

/* ========================================
   SMALL PHONE
======================================== */

@media (max-width: 480px) {

    .cards-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
    }

    .card-number {
        font-size: 9px;
    }

    .card-status {
        font-size: 6px;
    }

    .series-divider {
        min-height: 96px;
    }

    .series-divider-inner {
        min-width: 88%;
        padding: 14px 12px;
    }

}

/* ========================================
   SCROLLBAR
======================================== */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #080507;
}

::-webkit-scrollbar-thumb {
    background: #3b111b;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #71172a;
}

</style>
</head>

<body>

<!-- ========================================
     HEADER
======================================== -->

<header>

    <div class="devil">👿</div>

    <h1>
        PERTHSANTA CARD COLLECTION 👿
    </h1>

    <p class="subtitle">
        Because of love, every card has its own value. 🖤🤍❤️
    </p>

</header>


<main>

    <!-- ====================================
         HOME PAGE
    ===================================== -->

    <section id="homePage" class="home-page">

        <div class="home-intro">

            <h2>
                MY CARD BOOK
            </h2>

            <p>
                CHOOSE A COLLECTION
            </p>

        </div>

        <div
            id="locationGrid"
            class="location-grid">
        </div>

    </section>


    <!-- ====================================
         LOCATION PAGE
    ===================================== -->

    <section
        id="locationPage"
        class="location-page">

        <div class="location-top">

            <button
                class="back-button"
                onclick="goHome()">

                ← BACK TO COLLECTIONS

            </button>

            <div class="location-title">

                <h2 id="locationTitle">
                    LOCATION
                </h2>

                <p>
                    CARD COLLECTION
                </p>

            </div>

        </div>


        <!-- ==================================
             SUMMARY DASHBOARD
        =================================== -->

        <div class="summary-dashboard">

            <div class="summary-heading">

                <h3>
                    COLLECTION SUMMARY
                </h3>

                <p>
                    EVERY CARD COUNTS 🖤🤍❤️
                </p>

            </div>


            <div class="summary-stats">

                <div class="summary-stat">

                    <span
                        class="stat-number"
                        id="summarySeries">
                        0
                    </span>

                    <span class="stat-label">
                        SERIES
                    </span>

                </div>


                <div class="summary-stat">

                    <span
                        class="stat-number"
                        id="summaryTotal">
                        0
                    </span>

                    <span class="stat-label">
                        TOTAL CARDS
                    </span>

                </div>


                <div class="summary-stat collected">

                    <span
                        class="stat-number"
                        id="summaryOwned">
                        0
                    </span>

                    <span class="stat-label">
                        COLLECTED

/* ==================================================
   STATE
================================================== */

let currentLocationIndex = null;

let collection =
    JSON.parse(
        localStorage.getItem("myCardCollection")
    ) || {};


/* ==================================================
   SAVE
================================================== */

function saveCollection() {

    localStorage.setItem(
        "myCardCollection",
        JSON.stringify(collection)
    );

}


/* ==================================================
   TOTAL CARDS
================================================== */

function getTotalCards(location) {

    return location.series.reduce(
        (total, series) =>
            total + series.count,
        0
    );

}


/* ==================================================
   OWNED COUNT
================================================== */

function getOwnedCount(locationIndex) {

    const location =
        locations[locationIndex];

    let count = 0;

    location.series.forEach(
        (series, seriesIndex) => {

            for (
                let cardNumber = 1;
                cardNumber <= series.count;
                cardNumber++
            ) {

                const key =
                    `${locationIndex}-${seriesIndex}-${cardNumber}`;

                if (collection[key]) {
                    count++;
                }

            }

        }
    );

    return count;

}


/* ==================================================
   SERIES OWNED COUNT
================================================== */

function getSeriesOwnedCount(
    locationIndex,
    seriesIndex
) {

    const series =
        locations[locationIndex]
            .series[seriesIndex];

    let count = 0;

    for (
        let cardNumber = 1;
        cardNumber <= series.count;
        cardNumber++
    ) {

        const key =
            `${locationIndex}-${seriesIndex}-${cardNumber}`;

        if (collection[key]) {
            count++;
        }

    }

    return count;

}


/* ==================================================
   RENDER HOME
================================================== */

function renderHome() {

    const grid =
        document.getElementById(
            "locationGrid"
        );

    grid.innerHTML = "";

    locations.forEach(
        (location, index) => {

            const total =
                getTotalCards(location);

            const owned =
                getOwnedCount(index);

            const percentage =
                total === 0
                    ? 0
                    : Math.round(
                        owned / total * 100
                    );

            const card =
                document.createElement("div");

            card.className =
                "location-card";

            card.onclick = () =>
                openLocation(index);

            card.innerHTML = `

                <h3>
                    ${location.name}
                </h3>

                <div class="location-count">
                    ${location.series.length} SERIES
                    ·
                    ${total} CARDS
                </div>

                <div class="location-progress">

                    <div class="location-progress-top">

                        <span>
                            COLLECTION
                        </span>

                        <span>
                            ${owned} / ${total}
                        </span>

                    </div>

                    <div class="location-progress-bar">

                        <div
                            class="location-progress-fill"
                            style="width:${percentage}%">
                        </div>

                    </div>

                </div>

            `;

            grid.appendChild(card);

        }
    );

}


/* ==================================================
   OPEN LOCATION
================================================== */

function openLocation(index) {

    currentLocationIndex = index;

    document.getElementById(
        "homePage"
    ).style.display = "none";

    document.getElementById(
        "locationPage"
    ).style.display = "block";

    document.getElementById(
        "locationTitle"
    ).textContent =
        locations[index].name;

    document.getElementById(
        "searchInput"
    ).value = "";

    renderSummaryDashboard();

    renderCollection();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==================================================
   GO HOME
================================================== */

function goHome() {

    currentLocationIndex = null;

    document.getElementById(
        "locationPage"
    ).style.display = "none";

    document.getElementById(
        "homePage"
    ).style.display = "block";

    document.getElementById(
        "searchInput"
    ).value = "";

    renderHome();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==================================================
   SUMMARY DASHBOARD
================================================== */

function renderSummaryDashboard() {

    if (
        currentLocationIndex === null
    ) {
        return;
    }

    const location =
        locations[currentLocationIndex];

    const total =
        getTotalCards(location);

    const owned =
        getOwnedCount(
            currentLocationIndex
        );

    const missing =
        total - owned;

    const percentage =
        total === 0
            ? 0
            : Math.round(
                owned / total * 100
            );


    document.getElementById(
        "summarySeries"
    ).textContent =
        location.series.length;


    document.getElementById(
        "summaryTotal"
    ).textContent =
        total;


    document.getElementById(
        "summaryOwned"
    ).textContent =
        owned;


    document.getElementById(
        "summaryMissing"
    ).textContent =
        missing;


    document.getElementById(
        "summaryPercentage"
    ).textContent =
        `${percentage}%`;


    document.getElementById(
        "summaryProgressFill"
    ).style.width =
        `${percentage}%`;


    /* SERIES BREAKDOWN */

    const list =
        document.getElementById(
            "seriesSummaryList"
        );

    list.innerHTML = "";


    location.series.forEach(
        (series, seriesIndex) => {

            const seriesOwned =
                getSeriesOwnedCount(
                    currentLocationIndex,
                    seriesIndex
                );

            const item =
                document.createElement("div");

            item.className =
                "series-summary-item";


            if (
                seriesOwned === series.count
            ) {

                item.classList.add(
                    "completed"
                );

            }


            item.textContent =
                `${series.name} ${seriesOwned}/${series.count}`;


            list.appendChild(item);

        }
    );

}


/* ==================================================
   RENDER COLLECTION
================================================== */

function renderCollection() {

    if (
        currentLocationIndex === null
    ) {
        return;
    }

    const container =
        document.getElementById(
            "collectionContainer"
        );

    container.innerHTML = "";


    const location =
        locations[currentLocationIndex];


    location.series.forEach(
        (series, seriesIndex) => {

            const section =
                document.createElement("section");

            section.className =
                "series-section";


            const seriesOwned =
                getSeriesOwnedCount(
                    currentLocationIndex,
                    seriesIndex
                );


            /* 完成系列 */

            if (
                seriesOwned === series.count
            ) {

                section.classList.add(
                    "completed"
                );

            }


            /* ==================================
               卡册分隔页
            ================================== */

            const divider =
                document.createElement("div");

            divider.className =
                "series-divider";


            divider.innerHTML = `

                <div class="series-divider-inner">

                    <div class="series-index">
                        SERIES
                        ${String(seriesIndex + 1).padStart(2, "0")}
                    </div>

                    <h3 class="series-divider-title">
                        ${series.name}
                    </h3>

                    <div class="series-divider-count">
                        ${seriesOwned} / ${series.count}
                        COLLECTED
                    </div>

                </div>

            `;


            section.appendChild(divider);


            /* ==================================
               卡片区域
            ================================== */

            const grid =
                document.createElement("div");

            grid.className =
                "cards-grid";


            for (
                let cardNumber = 1;
                cardNumber <= series.count;
                cardNumber++
            ) {

                const number =
                    String(cardNumber)
                        .padStart(3, "0");


                const key =
                    `${currentLocationIndex}-${seriesIndex}-${cardNumber}`;


                const isOwned =
                    !!collection[key];


                const card =
                    document.createElement("div");


                card.className =
                    `card ${
                        isOwned
                            ? "owned"
                            : "not-owned"
                    }`;


                card.dataset.number =
                    number;


                card.onclick = () =>
                    toggleCard(
                        key,
                        card
                    );


                card.innerHTML = `

                    <div class="owned-mark">
                        ❤️
                    </div>

                    <div class="card-image">

                        <img
                            src="images/${number}.jpg"
                            alt="${series.name} ${number}"
                            onerror="
                                this.style.display='none';
                                this.parentElement.innerHTML='<div class=&quot;no-image&quot;>NO IMAGE</div>';
                            "
                        >

                    </div>

                    <div class="card-info">

                        <div class="card-number">
                            ${number}
                        </div>

                        <div class="card-status">
                            ${
                                isOwned
                                    ? "- 🖤🤍❤️ get"
                                    : "- havent get 😭"
                            }
                        </div>

                    </div>

                `;


                grid.appendChild(card);

            }


            section.appendChild(grid);

            container.appendChild(section);

        }
    );

}


/* ==================================================
   TOGGLE CARD
================================================== */

function toggleCard(
    key,
    cardElement
) {

    collection[key] =
        !collection[key];

    saveCollection();


    if (collection[key]) {

        cardElement.classList.remove(
            "not-owned"
        );

        cardElement.classList.add(
            "owned"
        );

    } else {

        cardElement.classList.remove(
            "owned"
        );

        cardElement.classList.add(
            "not-owned"
        );

    }


    /* 更新状态文字 */

    const status =
        cardElement.querySelector(
            ".card-status"
        );

    if (status) {

        status.innerHTML =
            collection[key]
                ? "- 🖤🤍❤️ get"
                : "- havent get 😭";

    }


    /*
       更新 ❤️
    */

    const mark =
        cardElement.querySelector(
            ".owned-mark"
        );

    if (mark) {

        mark.style.display =
            collection[key]
                ? "flex"
                : "none";

    }


    /*
       更新 Dashboard
    */

    renderSummaryDashboard();


    /*
       更新首页地点进度
    */

    renderHome();


    /*
       更新当前系列分隔页的收藏数量
    */

    updateSeriesDivider(
        cardElement
    );

}


/* ==================================================
   UPDATE SERIES DIVIDER
================================================== */

function updateSeriesDivider(
    cardElement
) {

    if (
        currentLocationIndex === null
    ) {
        return;
    }


    const section =
        cardElement.closest(
            ".series-section"
        );


    if (!section) {
        return;
    }


    const sections =
        Array.from(
            document.querySelectorAll(
                ".series-section"
            )
        );


    const seriesIndex =
        sections.indexOf(section);


    if (seriesIndex < 0) {
        return;
    }


    const series =
        locations[currentLocationIndex]
            .series[seriesIndex];


    const owned =
        getSeriesOwnedCount(
            currentLocationIndex,
            seriesIndex
        );


    const countElement =
        section.querySelector(
            ".series-divider-count"
        );


    if (countElement) {

        countElement.textContent =
            `${owned} / ${series.count} COLLECTED`;

    }


    /*
       全部收藏后给分隔页增加完成状态
    */

    if (
        owned === series.count
    ) {

        section.classList.add(
            "completed"
        );

    } else {

        section.classList.remove(
            "completed"
        );

    }

}


/* ==================================================
   SEARCH CARDS
================================================== */

function searchCards() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const keyword =
        input.value
            .trim()
            .toLowerCase();


    const cards =
        document.querySelectorAll(
            ".card"
        );


    let found = 0;


    cards.forEach(
        card => {

            card.classList.remove(
                "search-highlight"
            );


            if (
                keyword === ""
            ) {

                card.style.display =
                    "";

                found++;

                return;

            }


            const number =
                card.dataset.number
                    .toLowerCase();


            if (
                number.includes(keyword)
            ) {

                card.style.display =
                    "";

                card.classList.add(
                    "search-highlight"
                );

                found++;

            } else {

                card.style.display =
                    "none";

            }

        }
    );


    const noResults =
        document.getElementById(
            "noResults"
        );


    if (
        keyword !== "" &&
        found === 0
    ) {

        noResults.style.display =
            "block";

    } else {

        noResults.style.display =
            "none";

    }

}


/* ==================================================
   RESET COLLECTION
================================================== */

function resetCollection() {

    const confirmed =
        confirm(
            "Are you sure you want to reset your entire collection?"
        );


    if (!confirmed) {
        return;
    }


    collection = {};


    saveCollection();


    if (
        currentLocationIndex !== null
    ) {

        renderSummaryDashboard();

        renderCollection();

    }


    renderHome();

}

================================================== */

renderHome();
