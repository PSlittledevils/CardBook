<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          circle at top,
          #3a0000 0%,
          #120000 35%,
          #050505 75%
        );

      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      text-align: center;
      padding: 45px 20px 30px;

      border-bottom: 2px solid #5c0000;

      background:
        linear-gradient(
          180deg,
          rgba(90, 0, 0, 0.55),
          rgba(10, 0, 0, 0.9)
        );

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.8);
    }

    header h1 {
      margin: 0;

      font-size:
        clamp(28px, 5vw, 54px);

      letter-spacing: 3px;

      text-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff0000,
        0 0 35px #700000;
    }

    header p {
      margin: 15px 0 0;

      color: #dddddd;

      font-size:
        clamp(14px, 2vw, 18px);

      letter-spacing: 1px;
    }


    /* =========================
       MUSIC PLAYER
    ========================= */

    .music-player {

      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 9999;

      display: flex;
      align-items: center;

      gap: 10px;

      padding: 10px 14px;

      border: 1px solid #7d0000;
      border-radius: 12px;

      background:
        rgba(10, 0, 0, 0.94);

      box-shadow:
        0 0 10px rgba(255, 0, 0, 0.25),
        0 0 30px rgba(100, 0, 0, 0.4);

      backdrop-filter: blur(10px);
    }

    .music-title {

      color: #ff6666;

      font-size: 12px;

      font-weight: bold;

      letter-spacing: 1px;
    }

    #musicButton {

      border: 1px solid #b00000;

      background: #210000;

      color: white;

      padding: 8px 12px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: bold;

      font-size: 12px;

      transition: 0.2s;
    }

    #musicButton:hover {

      background: #650000;

      box-shadow:
        0 0 15px rgba(255, 0, 0, 0.5);
    }


    /* =========================
       MAIN
    ========================= */

    main {

      width: min(1500px, 94%);

      margin: auto;

      padding-bottom: 80px;
    }


    /* =========================
       HOME
    ========================= */

    .home-section {

      padding: 40px 0 25px;
    }

    .home-section h2 {

      text-align: center;

      margin-bottom: 25px;

      font-size: 28px;

      color: #ff5555;

      letter-spacing: 2px;
    }


    .location-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 22px;
    }


    .location-card {

      position: relative;

      min-height: 190px;

      border: 1px solid #620000;

      border-radius: 16px;

      overflow: hidden;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          rgba(80, 0, 0, 0.8),
          rgba(8, 8, 8, 0.95)
        );

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.65),
        inset 0 0 30px rgba(120, 0, 0, 0.15);

      transition:
        transform 0.25s,
        box-shadow 0.25s;
    }


    .location-card:hover {

      transform:
        translateY(-6px);

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.8),
        0 0 25px rgba(255, 0, 0, 0.25);
    }


    .location-card-content {

      position: relative;

      z-index: 2;

      min-height: 190px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      padding: 25px;
    }


    .devil {

      font-size: 45px;

      margin-bottom: 8px;

      letter-spacing: 5px;
    }


    .location-name {

      font-size: 30px;

      font-weight: bold;

      letter-spacing: 3px;

      text-shadow:
        0 0 12px #ff0000;
    }


    .location-count {

      margin-top: 10px;

      color: #bbbbbb;

      font-size: 14px;
    }


    /* =========================
       DASHBOARD
    ========================= */

    .dashboard {

      margin: 30px 0 45px;

      padding: 25px;

      border: 1px solid #620000;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          rgba(40, 0, 0, 0.7),
          rgba(10, 10, 10, 0.95)
        );

      box-shadow:
        inset 0 0 30px rgba(120, 0, 0, 0.1),
        0 10px 30px rgba(0, 0, 0, 0.6);
    }


    .dashboard h2 {

      margin-top: 0;

      text-align: center;

      color: #ff4444;

      letter-spacing: 2px;
    }


    .summary-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 15px;

      margin-top: 20px;
    }


    .summary-box {

      text-align: center;

      padding: 18px 10px;

      border: 1px solid #400000;

      border-radius: 12px;

      background:
        rgba(0, 0, 0, 0.55);
    }


    .summary-number {

      font-size: 30px;

      font-weight: bold;

      color: #ff5555;
    }


    .summary-label {

      margin-top: 6px;

      color: #aaaaaa;

      font-size: 13px;
    }


    .progress-container {

      margin-top: 25px;
    }


    .progress-label {

      display: flex;

      justify-content: space-between;

      margin-bottom: 8px;

      color: #dddddd;

      font-size: 14px;
    }


    .progress-bar {

      height: 15px;

      background: #1b1b1b;

      border: 1px solid #450000;

      border-radius: 999px;

      overflow: hidden;
    }


    .progress-fill {

      height: 100%;

      width: 0%;

      background:
        linear-gradient(
          90deg,
          #6b0000,
          #ff0000
        );

      box-shadow:
        0 0 15px rgba(255, 0, 0, 0.7);

      transition:
        width 0.4s ease;
    }


    .series-breakdown {

      margin-top: 25px;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px 20px;
    }


    .breakdown-item {

      font-size: 13px;

      color: #bbbbbb;

      border-bottom:
        1px solid #250000;

      padding: 7px 0;
    }


    .breakdown-item span {

      color: #ff5555;

      font-weight: bold;
    }


    /* =========================
       CONTROLS
    ========================= */

    .controls {

      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      justify-content: center;

      margin-bottom: 40px;
    }


    .control-button {

      padding: 11px 18px;

      border-radius: 9px;

      border: 1px solid #710000;

      background: #170000;

      color: #ffffff;

      cursor: pointer;

      font-weight: bold;

      transition: 0.2s;
    }


    .control-button:hover {

      background: #650000;

      box-shadow:
        0 0 15px rgba(255, 0, 0, 0.35);
    }


    .search-box {

      min-width: 220px;

      padding: 11px 15px;

      border-radius: 9px;

      border: 1px solid #710000;

      background: #080808;

      color: white;

      outline: none;
    }


    .search-box:focus {

      border-color: #ff2222;

      box-shadow:
        0 0 12px rgba(255, 0, 0, 0.25);
    }


    /* =========================
       LOCATION
    ========================= */

    .location-section {

      margin-bottom: 70px;
    }


    .location-heading {

      padding: 20px;

      margin-bottom: 30px;

      border-top:
        2px solid #7c0000;

      border-bottom:
        2px solid #7c0000;

      background:
        linear-gradient(
          90deg,
          rgba(100, 0, 0, 0.3),
          rgba(0, 0, 0, 0.8),
          rgba(100, 0, 0, 0.3)
        );

      text-align: center;
    }


    .location-heading h2 {

      margin: 0;

      font-size:
        clamp(25px, 4vw, 40px);

      letter-spacing: 4px;

      text-shadow:
        0 0 15px #ff0000;
    }


    .location-heading p {

      margin: 8px 0 0;

      color: #aaa;
    }


    /* =========================
       SERIES
    ========================= */

    .series-section {

      margin-bottom: 55px;
    }


    .series-divider {

      position: relative;

      margin-bottom: 22px;

      padding: 18px 20px;

      border-left:
        5px solid #a00000;

      border-top:
        1px solid #480000;

      border-bottom:
        1px solid #480000;

      background:
        linear-gradient(
          90deg,
          rgba(90, 0, 0, 0.5),
          rgba(12, 12, 12, 0.9)
        );

      box-shadow:
        inset 0 0 20px
        rgba(120, 0, 0, 0.08);
    }


    .series-divider.completed {

      box-shadow:
        0 0 18px
        rgba(255, 0, 0, 0.2),

        inset 0 0 25px
        rgba(255, 0, 0, 0.08);
    }


    .series-number {

      color: #ff4444;

      font-size: 13px;

      font-weight: bold;

      letter-spacing: 2px;
    }


    .series-title {

      margin: 5px 0;

      font-size:
        clamp(19px, 2.5vw, 28px);

      font-weight: bold;
    }


    .series-count {

      color: #999999;

      font-size: 13px;
    }


    /* =========================
       CARDS
    ========================= */

    .card-grid {

      display: grid;

      grid-template-columns:
        repeat(10, 1fr);

      gap: 10px;
    }


    .card {

      position: relative;

      min-width: 0;

      aspect-ratio: 2 / 3;

      border:
        1px solid #2c2c2c;

      border-radius: 8px;

      overflow: hidden;

      background: #111111;

      cursor: pointer;

      filter:
        grayscale(100%)
        brightness(0.25);

      opacity: 0.7;

      transition:
        transform 0.2s,
        filter 0.25s,
        opacity 0.25s,
        box-shadow 0.25s;
    }


    .card:hover {

      transform:
        translateY(-4px)
        scale(1.02);

      z-index: 5;
    }


    .card.owned {

      filter:
        grayscale(0%)
        brightness(1);

      opacity: 1;

      border-color:
        #d00000;

      box-shadow:
        0 0 8px
        rgba(255, 0, 0, 0.55),

        0 0 20px
        rgba(255, 0, 0, 0.3);
    }


    .card img {

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;
    }


    .no-image {

      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 5px;

      color: #555555;

      font-size: 11px;

      font-weight: bold;

      background: #111111;
    }


    .card-number {

      position: absolute;

      top: 5px;

      left: 5px;

      padding: 3px 5px;

      border-radius: 5px;

      background:
        rgba(0, 0, 0, 0.8);

      color: white;

      font-size: 10px;

      font-weight: bold;
    }


    .card-status {

      position: absolute;

      bottom: 0;

      left: 0;

      right: 0;

      padding: 6px 3px;

      background:
        rgba(0, 0, 0, 0.82);

      text-align: center;

      color: #888888;

      font-size: 9px;

      font-weight: bold;
    }


    .card.owned .card-status {

      color: #ff7777;
    }


    .heart {

      position: absolute;

      top: 5px;

      right: 5px;

      font-size: 15px;

      opacity: 0;

      transition:
        opacity 0.2s;
    }


    .card.owned .heart {

      opacity: 1;

      text-shadow:
        0 0 10px #ff0000;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {

      text-align: center;

      padding: 35px 20px;

      border-top:
        1px solid #3d0000;

      color: #666666;

      font-size: 12px;
    }


    /* =========================
       HIDDEN
    ========================= */

    .hidden {

      display: none !important;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1100px) {

      .card-grid {

        grid-template-columns:
          repeat(6, 1fr);
      }


      .location-grid {

        grid-template-columns: 1fr;
      }


      .summary-grid {

        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 650px) {

      header {

        padding-top: 90px;
      }


      .music-player {

        top: 12px;

        left: 12px;

        right: 12px;

        justify-content:
          space-between;
      }


      .card-grid {

        grid-template-columns:
          repeat(4, 1fr);

        gap: 7px;
      }


      .series-breakdown {

        grid-template-columns:
          1fr;
      }


      .dashboard {

        padding: 17px;
      }


      .summary-grid {

        grid-template-columns:
          repeat(2, 1fr);
      }


      .controls {

        flex-direction:
          column;
      }


      .search-box,
      .control-button {

        width: 100%;
      }

    }


    @media (max-width: 400px) {

      .card-grid {

        grid-template-columns:
          repeat(3, 1fr);
      }

    }

  </style>
</head>

    /* =====================================
       COLLECTION STORAGE
    ====================================== */

    let ownedCards =
      JSON.parse(
        localStorage.getItem(
          "myCardCollection"
        ) || "{}"
      );



    function saveCollection() {

      localStorage.setItem(
        "myCardCollection",
        JSON.stringify(
          ownedCards
        )
      );

    }



    /* =====================================
       TOTAL CARDS
    ====================================== */

    function getTotalCards() {

      let total = 0;


      locations.forEach(
        location => {

          location.series.forEach(
            series => {

              total +=
                series.count;

            }

          );

        }
      );


      return total;

    }



    /* =====================================
       CARD KEY
    ====================================== */

    function getCardKey(
      location,
      series,
      number
    ) {

      return `
        ${location.name}|||
        ${series.name}|||
        ${number}
      `.replace(/\s+/g, "");

    }



    /* =====================================
       SAFE ID
    ====================================== */

    function makeSafeId(text) {

      return text
        .replace(
          /[^a-zA-Z0-9]/g,
          "-"
        )
        .toLowerCase();

    }



    /* =====================================
       LOCATION HOME CARDS
    ====================================== */

    function renderLocationCards() {

      const container =
        document.getElementById(
          "locationGrid"
        );


      container.innerHTML = "";


      locations.forEach(
        location => {

          let total = 0;


          location.series.forEach(
            series => {

              total +=
                series.count;

            }
          );


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "location-card";


          card.onclick = () => {

            const target =
              document.getElementById(
                `location-${location.name}`
              );


            if (target) {

              target.scrollIntoView({
                behavior: "smooth"
              });

            }

          };


          card.innerHTML = `

            <div class="location-card-content">

              <div class="devil">

                ${getLocationIcon(
                  location.name
                )}

              </div>


              <div class="location-name">

                ${location.name}

              </div>


              <div class="location-count">

                ${location.series.length}
                series ·
                ${total}
                cards

              </div>

            </div>

          `;


          container.appendChild(
            card
          );

        }
      );

    }



    /* =====================================
       RENDER LOCATIONS
    ====================================== */

    function renderLocations() {

      const container =
        document.getElementById(
          "locationsContainer"
        );


      container.innerHTML = "";


      locations.forEach(
        location => {


          const locationSection =
            document.createElement(
              "section"
            );


          locationSection.className =
            "location-section";


          locationSection.id =
            `location-${location.name}`;


          let totalCards = 0;


          location.series.forEach(
            series => {

              totalCards +=
                series.count;

            }
          );


          locationSection.innerHTML = `

            <div class="location-heading">

              <h2>

                ${getLocationIcon(
                  location.name
                )}

                ${location.name}

              </h2>


              <p>

                ${location.series.length}
                series ·
                ${totalCards}
                cards

              </p>

            </div>


            <div class="series-container"></div>

          `;


          container.appendChild(
            locationSection
          );


          const seriesContainer =
            locationSection.querySelector(
              ".series-container"
            );


          location.series.forEach(
            (
              series,
              seriesIndex
            ) => {

              renderSeries(
                location,
                series,
                seriesIndex,
                seriesContainer
              );

            }
          );

        }
      );

    }



    /* =====================================
       RENDER SERIES
    ====================================== */

    function renderSeries(
      location,
      series,
      seriesIndex,
      container
    ) {

      const seriesSection =
        document.createElement(
          "section"
        );


      seriesSection.className =
        "series-section";


      const divider =
        document.createElement(
          "div"
        );


      divider.className =
        "series-divider";


      divider.innerHTML = `

        <div class="series-number">

          SERIES
          ${String(
            seriesIndex + 1
          ).padStart(2, "0")}

        </div>


        <div class="series-title">

          ${series.name}

        </div>


        <div class="series-count">

          0 /
          ${series.count}
          collected

        </div>

      `;


      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "card-grid";


      for (
        let i = 1;
        i <= series.count;
        i++
      ) {

        const number =
          String(i).padStart(
            3,
            "0"
          );


        const card =
          createCard(
            location,
            series,
            number
          );


        grid.appendChild(
          card
        );

      }


      seriesSection.appendChild(
        divider
      );


      seriesSection.appendChild(
        grid
      );


      container.appendChild(
        seriesSection
      );


      updateSeriesCount(
        location,
        series,
        divider
      );

    }



    /* =====================================
       CREATE CARD
    ====================================== */

    function createCard(
      location,
      series,
      number
    ) {

      const key =
        getCardKey(
          location,
          series,
          number
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      card.dataset.number =
        number;


      if (
        ownedCards[key]
      ) {

        card.classList.add(
          "owned"
        );

      }


      const imagePath =
        `images/${location.imageFolder}/${series.imageFolder}/${number}.jpg`;


      card.innerHTML = `

        <img
          src="${imagePath}"

          alt="${series.name} ${number}"

          onerror="
            this.style.display='none';

            this.parentElement.innerHTML=
            '<div class=&quot;no-image&quot;>NO IMAGE</div>';
          "
        >


        <div class="card-number">

          ${number}

        </div>


        <div class="heart">

          🖤

        </div>


        <div class="card-status">

          ${
            ownedCards[key]
              ? "- 🖤🤍❤️ get"
              : "- havent get 😭"
          }

        </div>

      `;


      card.addEventListener(
        "click",
        () => {

          toggleCard(
            key,
            card
          );

        }
      );


      return card;

    }



    /* =====================================
       TOGGLE CARD
    ====================================== */

    function toggleCard(
      key,
      card
    ) {

      ownedCards[key] =
        !ownedCards[key];


      if (
        ownedCards[key]
      ) {

        card.classList.add(
          "owned"
        );

      } else {

        card.classList.remove(
          "owned"
        );

      }


      updateCardText(
        card
      );


      saveCollection();


      updateDashboard();

    }



    /* =====================================
       UPDATE CARD TEXT
    ====================================== */

    function updateCardText(
      card
    ) {

      const status =
        card.querySelector(
          ".card-status"
        );


      if (!status) {
        return;
      }


      if (
        card.classList.contains(
          "owned"
        )
      ) {

        status.textContent =
          "- 🖤🤍❤️ get";

      } else {

        status.textContent =
          "- havent get 😭";

      }

    }



    /* =====================================
       UPDATE SERIES
    ====================================== */

    function updateSeriesCount(
      location,
      series,
      divider
    ) {

      let collected = 0;


      for (
        let i = 1;
        i <= series.count;
        i++
      ) {

        const number =
          String(i).padStart(
            3,
            "0"
          );


        const key =
          getCardKey(
            location,
            series,
            number
          );


        if (
          ownedCards[key]
        ) {

          collected++;

        }

      }


      const countElement =
        divider.querySelector(
          ".series-count"
        );


      if (
        countElement
      ) {

        countElement.textContent =
          `${collected} / ${series.count} collected`;

      }


      if (
        collected ===
        series.count
      ) {

        divider.classList.add(
          "completed"
        );

      } else {

        divider.classList.remove(
          "completed"
        );

      }

    }



    /* =====================================
       UPDATE ALL SERIES
    ====================================== */

    function updateAllSeriesCounts() {

      const sections =
        document.querySelectorAll(
          ".location-section"
        );


      locations.forEach(
        location => {

          const locationElement =
            document.getElementById(
              `location-${location.name}`
            );


          if (
            !locationElement
          ) {
            return;
          }


          const dividers =
            locationElement.querySelectorAll(
              ".series-divider"
            );


          location.series.forEach(
            (
              series,
              index
            ) => {

              if (
                dividers[index]
              ) {

                updateSeriesCount(
                  location,
                  series,
                  dividers[index]
                );

              }

            }
          );

        }
      );

    }



    /* =====================================
       DASHBOARD
    ====================================== */

    function updateDashboard() {

      const totalSeries =
        locations.reduce(
          (
            total,
            location
          ) =>
            total +
            location.series.length,
          0
        );


      const totalCards =
        getTotalCards();


      let collected = 0;


      Object.keys(
        ownedCards
      ).forEach(
        key => {

          if (
            ownedCards[key]
          ) {

            collected++;

          }

        }
      );


      const missing =
        Math.max(
          0,
          totalCards -
          collected
        );


      const percentage =
        totalCards === 0

          ? 0

          : Math.round(
              (
                collected /
                totalCards
              ) * 100
            );


      document.getElementById(
        "seriesTotal"
      ).textContent =
        totalSeries;


      document.getElementById(
        "cardTotal"
      ).textContent =
        totalCards;


      document.getElementById(
        "collectedTotal"
      ).textContent =
        collected;


      document.getElementById(
        "missingTotal"
      ).textContent =
        missing;


      document.getElementById(
        "percentage"
      ).textContent =
        `${percentage}%`;


      document.getElementById(
        "progressFill"
      ).style.width =
        `${percentage}%`;


      renderBreakdown();


      updateAllSeriesCounts();

    }



    /* =====================================
       BREAKDOWN
    ====================================== */

    function renderBreakdown() {

      const container =
        document.getElementById(
          "seriesBreakdown"
        );


      container.innerHTML = "";


      locations.forEach(
        location => {

          location.series.forEach(
            series => {

              let collected = 0;


              for (
                let i = 1;
                i <= series.count;
                i++
              ) {

                const number =
                  String(i).padStart(
                    3,
                    "0"
                  );


                const key =
                  getCardKey(
                    location,
                    series,
                    number
                  );


                if (
                  ownedCards[key]
                ) {

                  collected++;

                }

              }


              const item =
                document.createElement(
                  "div"
                );


              item.className =
                "breakdown-item";


              item.innerHTML = `

                ${getLocationIcon(
                  location.name
                )}

                ${location.name}

                ·

                ${series.name}

                :

                <span>

                  ${collected}/${series.count}

                </span>

              `;


              container.appendChild(
                item
              );

            }
          );

        }
      );

    }



    /* =====================================
       SEARCH
    ====================================== */

    function searchCards() {

      const input =
        document.getElementById(
          "searchInput"
        );


      const search =
        input.value
          .trim()
          .toLowerCase();


      const cards =
        document.querySelectorAll(
          ".card"
        );


      cards.forEach(
        card => {

          const number =
            card.dataset.number
              .toLowerCase();


          if (
            search === "" ||
            number.includes(
              search
            )
          ) {

            card.classList.remove(
              "hidden"
            );

          } else {

            card.classList.add(
              "hidden"
            );

          }

        }
      );

    }



    /* =====================================
       RESET SEARCH
    ====================================== */

    function resetSearch() {

      document.getElementById(
        "searchInput"
      ).value = "";


      document.querySelectorAll(
        ".card"
      ).forEach(
        card => {

          card.classList.remove(
            "hidden"
          );

        }
      );

    }



    /* =====================================
       RESET COLLECTION
    ====================================== */

    function resetCollection() {

      const confirmReset =
        confirm(
          "Are you sure you want to reset your entire collection?"
        );


      if (
        !confirmReset
      ) {

        return;

      }


      ownedCards = {};


      saveCollection();


      renderLocations();


      updateDashboard();


      resetSearch();

    }



    /* =====================================
       INITIAL LOAD
    ====================================== */

    renderLocationCards();

    renderLocations();

    updateDashboard();



    /* =====================================
       YOUTUBE
    ====================================== */

    let player = null;

    let isPlaying = false;



    function onYouTubeIframeAPIReady() {

      player =
        new YT.Player(
          "youtubePlayer",
          {

            events: {

              onReady: function() {

                /*
                  尝试自动播放。
                  浏览器允许就自动播放。
                  浏览器禁止则需要点击 PLAY。
                */

                try {

                  player.playVideo();

                } catch (error) {

                  console.log(
                    "Autoplay was blocked."
                  );

                }

              },


              onStateChange:
                function(event) {


                  if (
                    event.data ===
                    YT.PlayerState.PLAYING
                  ) {

                    isPlaying =
                      true;


                    document.getElementById(
                      "musicButton"
                    ).textContent =
                      "⏸️ PAUSE MUSIC";

                  }


                  if (
                    event.data ===
                    YT.PlayerState.PAUSED
                  ) {

                    isPlaying =
                      false;


                    document.getElementById(
                      "musicButton"
                    ).textContent =
                      "▶️ PLAY MUSIC";

                  }


                  if (
                    event.data ===
                    YT.PlayerState.ENDED
                  ) {

                    isPlaying =
                      false;


                    document.getElementById(
                      "musicButton"
                    ).textContent =
                      "▶️ PLAY MUSIC";

                  }

                }

            }

          }
        );

    }



    /* =====================================
       PLAY / PAUSE
    ====================================== */

    function toggleMusic() {

      if (
        !player
      ) {

        return;

      }


      if (
        isPlaying
      ) {

        player.pauseVideo();

      } else {

        player.playVideo();

      }

    }
